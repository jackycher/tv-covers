name: 每日更新栏目封面

on:
  schedule:
    # 19:30 UTC = 北京时间 03:30
    - cron: "30 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Pillow
        run: pip install --disable-pip-version-check pillow

      - name: 转换新增栏目封面
        run: python tools/build_covers.py

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有新增栏目，无需提交"
          else
            git commit -m "chore: 更新栏目封面 $(date -u +%Y-%m-%d)"
            git push
          fi
